<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الامتحان</title>
    <meta property="og:title" id="ogTitle" content="الامتحان" />
    <meta name="twitter:title" id="twitterTitle" content="الامتحان" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="exam-page" id="pageBody">
    <!-- ===================== شريط اسم وشعار الموقع (يظهر في كل الشاشات) ===================== -->
    <div id="siteBrandBar" class="site-brand-bar hidden">
      <img id="siteBrandLogo" class="site-brand-logo hidden" alt="شعار الموقع" />
      <span id="siteBrandName" class="site-brand-name"></span>
    </div>

    <div id="loadingScreen" class="loading-screen">
      <div class="spinner"></div>
      <p>جاري التحميل...</p>
    </div>

    <!-- ===================== المرحلة 1: تسجيل البيانات ===================== -->
    <section id="registrationScreen" class="hidden">
      <div class="auth-container">
        <div class="dev-credit">Developed by Mike Talaat</div>
        <div class="auth-card">
          <div class="auth-header">
            <h2>بوابة الامتحانات</h2>
            <p>الرجاء تسجيل البيانات بدقة لبدء الامتحان الحالي</p>
          </div>

          <div id="registrationError" class="error-alert hidden">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="registrationErrorText"></span>
          </div>

          <form id="registrationForm" autocomplete="off">
            <div class="form-group">
              <label>الاسم الكامل رباعي</label>
              <div class="input-wrapper">
                <input
                  type="text"
                  name="user_name"
                  placeholder="اكتب اسمك كاملاً كما في الهوية"
                  required
                />
                <i class="fa-regular fa-user"></i>
              </div>
            </div>
            <div class="form-group">
              <label>رقم الهاتف المعتمد (11 رقم)</label>
              <div class="input-wrapper">
                <input
                  type="tel"
                  name="user_phone"
                  placeholder="01xxxxxxxxx"
                  maxlength="11"
                  minlength="11"
                  pattern="[0-9]{11}"
                  required
                  style="text-align: right"
                />
                <i class="fa-solid fa-phone"></i>
              </div>
            </div>
            <button type="submit" class="btn-submit">
              <span>الموافقة وبدء الامتحان</span>
              <i class="fa-solid fa-bolt"></i>
            </button>
          </form>
        </div>
      </div>
    </section>

    <!-- ===================== المرحلة 2: الامتحان ===================== -->
    <section id="examScreen" class="hidden">
      <div class="dev-credit">Developed by Mike Talaat</div>

      <div class="sticky-dashboard">
        <div class="header-main-row">
          <div class="exam-info">
            <div
              style="
                display: flex;
                align-items: baseline;
                gap: 0.6rem;
                flex-wrap: wrap;
              "
            >
              <h2 id="examTitle" style="margin: 0"></h2>
              <span
                id="examStage"
                style="
                  font-size: 0.88rem;
                  color: #94a3b8;
                  font-weight: 600;
                  opacity: 0.9;
                "
              ></span>
            </div>
            <div class="user-meta-tabs">
              <span class="meta-tag"
                ><i class="fa-regular fa-user"></i>
                <span id="userNameTag"></span
              ></span>
              <span class="meta-tag"
                ><i class="fa-solid fa-mobile-screen-button"></i>
                <span id="userPhoneTag"></span
              ></span>
            </div>
          </div>
          <div class="timer-badge" id="timerContainer">
            <i class="fa-regular fa-clock"></i> <span id="timer">30:00</span>
          </div>
        </div>
        <div class="progress-container">
          <div class="progress-bar-wrapper">
            <div class="progress-bar-fill" id="progressBar"></div>
          </div>
          <div class="progress-text" id="progressText">
            0 من أصل 0 أسئلة مكتملة
          </div>
        </div>
      </div>

      <div class="exam-container">
        <div id="submitErrorBox" class="submit-error-box hidden"></div>
        <form id="examForm">
          <div id="questionsContainer"></div>
          <div class="exam-actions-bar">
            <button type="button" class="btn-finish" id="submitExamBtn">
              إنهاء وتسليم الامتحان
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- ===================== مودال تفاعلي مشترك ===================== -->
    <div class="custom-modal-overlay" id="customModal">
      <div class="custom-modal-box">
        <div class="modal-icon-wrapper" id="modalIcon"></div>
        <h3 id="modalTitle">تأكيد الإجراء</h3>
        <p class="modal-text" id="modalText"></p>
        <div class="modal-summary hidden" id="modalSummary"></div>
        <div class="modal-buttons-group" id="modalButtons"></div>
      </div>
    </div>

    <!-- ===================== لايت بوكس لعرض صور السؤال بحجم كامل ===================== -->
    <div class="image-lightbox-overlay" id="imageLightbox">
      <button type="button" class="image-lightbox-close" id="imageLightboxCloseBtn" aria-label="إغلاق">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <img id="imageLightboxImg" alt="صورة السؤال بحجم كامل" />
    </div>

    <script type="module" src="js/exam.js?v=1.1.0"></script>
  </body>
</html>
