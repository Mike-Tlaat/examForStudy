<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نتيجة الامتحان</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .developer-credit {
        font-family: "Roboto", sans-serif;
        font-size: 0.9rem;
        color: var(--text-muted);
        letter-spacing: 1px;
        text-transform: uppercase;
        opacity: 0.7;
        direction: ltr;
      }
      .developer-credit strong {
        color: var(--primary);
        font-weight: 700;
      }
    </style>
  </head>
  <body class="results-page">
    <div id="siteBrandBar" class="site-brand-bar hidden">
      <img id="siteBrandLogo" class="site-brand-logo hidden" alt="شعار الموقع" />
      <span id="siteBrandName" class="site-brand-name"></span>
    </div>

    <div id="resultCard" class="result-card">
      <div class="loading-screen" style="min-height: auto">
        <div class="spinner"></div>
        <p>جاري تحميل النتيجة...</p>
      </div>
    </div>

    <div class="developer-credit">
      Developed by <strong>Mike Talaat</strong>
    </div>

    <script type="module" src="js/results.js?v=1.1.0"></script>
  </body>
</html>
